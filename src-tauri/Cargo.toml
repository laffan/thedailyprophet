[package]
name = "the-daily-prophet"
version = "0.1.0"
description = "A reader for interactive, web-based long-form writing. Capture stories as fully interactive offline snapshots and keep them on a shelf."
authors = ["The Daily Prophet contributors"]
edition = "2021"

[lib]
name = "daily_prophet_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable` enables multiwebview (Window::add_child) — the capture page is
# embedded as a child webview so the whole flow stays inside the main window.
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "deflate",
  "http2",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
